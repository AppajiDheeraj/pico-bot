<svg viewBox="0 0 860 482" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Use-case diagram: the user describes the system, answers questions, reviews the SRS, approves it, gets the SDLC recommendation and opens the trace; the Analyst and SDLC Planner agents do the work"><style>.uc{fill:#f3f6fa;stroke:#57606a;stroke-width:1.3}.sys{fill:none;stroke:#8c959f;stroke-width:1.5}.t{font:15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle}.b{font-weight:600}.a circle,.a line{fill:none;stroke:#1f2328;stroke-width:1.8}.l{stroke:#57606a;stroke-width:1.1}</style><rect width="860" height="482" rx="12" fill="#fff"/><rect x="255" y="16" width="350" height="450" rx="10" class="sys"/><text x="430" y="40" class="t b">Pico</text><ellipse cx="430" cy="82" rx="135" ry="25" class="uc"/><text x="430" y="87" class="t">Describe the system</text><ellipse cx="430" cy="148" rx="135" ry="25" class="uc"/><text x="430" y="153" class="t">Answer the questions</text><ellipse cx="430" cy="214" rx="135" ry="25" class="uc"/><text x="430" y="219" class="t">Review the SRS</text><ellipse cx="430" cy="280" rx="135" ry="25" class="uc"/><text x="430" y="285" class="t">Approve or ask for changes</text><ellipse cx="430" cy="346" rx="135" ry="25" class="uc"/><text x="430" y="351" class="t">Get the SDLC recommendation</text><ellipse cx="430" cy="412" rx="135" ry="25" class="uc"/><text x="430" y="417" class="t">Open the agent trace</text><g class="a"><circle cx="100" cy="201" r="11"/><line x1="100" y1="212" x2="100" y2="241"/><line x1="83" y1="223" x2="117" y2="223"/><line x1="100" y1="241" x2="86" y2="263"/><line x1="100" y1="241" x2="114" y2="263"/></g><text x="100" y="285" class="t b">User</text><g class="a"><circle cx="760" cy="116" r="11"/><line x1="760" y1="127" x2="760" y2="156"/><line x1="743" y1="138" x2="777" y2="138"/><line x1="760" y1="156" x2="746" y2="178"/><line x1="760" y1="156" x2="774" y2="178"/></g><text x="760" y="200" class="t b">Analyst agent</tex